<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>密码保护</title>
<script>
function checkPassword() {
    const password = document.getElementById('pwd').value;
    if (password === '780780') {
        // 显示看板
        document.getElementById('login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        localStorage.setItem('authed', 'true');
    } else {
        alert('密码错误');
    }
    return false;
}

// 检查是否已认证
if (localStorage.getItem('authed') === 'true') {
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
}
</script>
<style>
body { margin: 0; padding: 0; background: #0f1117; color: white; font-family: sans-serif; }
#login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
.login-box { background: #1a1d26; padding: 40px; border-radius: 12px; text-align: center; }
input { padding: 12px; margin: 10px 0; width: 200px; border: 1px solid #333; border-radius: 6px; background: #0f1117; color: white; }
button { padding: 12px 24px; background: #4ade80; border: none; border-radius: 6px; color: black; font-weight: bold; cursor: pointer; }
#iframe { width: 100%; height: 100vh; border: none; display: none; }
</style>
</head>
<body>
<div id="login">
    <div class="login-box">
        <h2>🔐 投资看板</h2>
        <input type="password" id="pwd" placeholder="输入密码">
        <br>
        <button onclick="checkPassword()">进入</button>
    </div>
</div>

<iframe id="dashboard" src="dashboard-simple.html"></iframe>
</body>
</html>
