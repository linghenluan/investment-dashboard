<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资看板</title>
<script>
// 密码保护
const PASSWORD_HASH = "82ae7ca678a3e36b094d5c97bfc10e7213b1872c40f8de66d76ef2ce19ae1a67";

// SHA256 简单实现
async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    const hashPromise = sha256(input);
    hashPromise.then(hash => {
        if (hash === PASSWORD_HASH) {
            document.getElementById('passwordScreen').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            // 存储认证（24小时有效）
            localStorage.setItem('dashboard_auth', hash + '_' + Date.now());
        } else {
            document.getElementById('errorMsg').textContent = '密码错误';
        }
    });
    return false;
}

// 检查本地存储的认证
function checkStoredAuth() {
    const stored = localStorage.getItem('dashboard_auth');
    if (!stored) return false;
    const [hash, timestamp] = stored.split('_');
    const now = Date.now();
    if (hash === PASSWORD_HASH && (now - parseInt(timestamp)) < 24*60*60*1000) {
        document.getElementById('passwordScreen').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        return true;
    }
    return false;
}

// 页面加载时检查
document.addEventListener('DOMContentLoaded', function() {
    if (!checkStoredAuth()) {
        document.getElementById('passwordScreen').style.display = 'flex';
    }
});
</script>
<style>
/* 密码保护层 */
#passwordScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0f1117;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}
.password-box {
    background: #1a1d26;
    padding: 30px;
    border-radius: 12px;
    width: 320px;
    text-align: center;
}
.password-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #fff;
}
.password-input {
    width: 100%;
    padding: 12px;
    background: #0f1117;
    border: 1px solid #333;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
}
.password-btn {
    width: 100%;
    padding: 12px;
    background: #4ade80;
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}
.error-msg {
    color: #f87171;
    font-size: 12px;
    margin-top: 8px;
    height: 16px;
}

/* 主内容 */
#dashboardContent {
    background: #0f1117;
    color: #e0e0e0;
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: 14px;
}
/* 更多样式... */
</style>
</head>
<body>
<!-- 密码保护层 -->
<div id="passwordScreen">
    <div class="password-box">
        <div class="password-title">🔐 投资看板</div>
        <input type="password" id="passwordInput" class="password-input" placeholder="输入密码" onkeypress="if(event.keyCode==13) checkPassword()">
        <button class="password-btn" onclick="checkPassword()">进入看板</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>
</div>

<!-- 主内容 -->
<div id="dashboardContent">
    <h1>投资看板</h1>
    <p>数据更新时间：2026-03-20 22:02</p>
    <!-- 这里放具体的看板内容 -->
</div>

<!-- JS依赖 -->
<script src="https://linghenluan.github.io/investment-dashboard/chart.min.js"></script>
<script src="https://linghenluan.github.io/investment-dashboard/dashboard.js"></script>
<script src="https://linghenluan.github.io/investment-dashboard/portfolio_chart.js"></script>
</body>
</html>
